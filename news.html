/* —— 仅本页：多源信息流（来源一级筛选 + 分类二级筛选 + 时间区间筛选 + 搜索 + 分批加载 + 每卡「问句子」）——

(function () {
  var BATCH = 20;
  var payload = {};
  try { payload = JSON.parse(document.getElementById('news-data').textContent.trim() || '{}') || {}; } catch (e) {}
  var data = payload.items || [], sources = payload.sources || [];

  var radarLoaded = !((payload.radar_rest || 0) > 0), radarLoading = false;
  var radarFail = 0, radarGaveUp = false;  // 分片拉取失败计数; 连续三次才认定不可用(见 ensureRadar)
  var navGen = 0;  // 每次分区切换/搜索 +1, 供异步回调判断自己是否已过期
  var state = { group: 'company', src: 'all', cat: 'all', time: 'all', cut: '', q: '', shown: list.querySelectorAll('.news-card').length };
  var GROUPS = [{ k: 'company', n: '句子动态', i: 'fa-solid fa-house-chimney' },
                { k: 'radar', n: '行业雷达', i: 'fa-solid fa-satellite-dish' },
                { k: 'all', n: '全部', i: 'fa-solid fa-layer-group' }];
  function grpOf(id) { var s = sources.filter(function (x) { return x.id === id; })[0]; return (s && s.group) || 'radar'; }
  function inGroup(it) { return state.group === 'all' || grpOf(it.source) === state.group; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function safeHref(u) { u = String(u == null ? '' : u).trim(); return /^https?:\/\//i.test(u) ? esc(u) : '#'; }  // 与 Python safe_href 同构: 非 http(s) 外链回 #(Bugbot PR#100)

  // 时间区间筛选：cut 是往回推算的 YYYY-MM-DD 下限（本地时区），条目日期是同构字符串可直接比较
  function dstr(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var TIMES = [
    { k: 'all', label: '全部时间', cut: '' },

  ];

  function cardHTML(it) {
    var icon = ICON[it.source] || 'fa-solid fa-newspaper';
    // 译题要与原题**真的不同**才算译题: 有些条目的 title_zh 与 title 一字不差(翻译层原样
    // 落回), 此时既拿它当标题、又渲染一行「原题：」, 同一个英文标题会显示两遍。
    var zhTitle = (it.title_zh && it.title_zh.trim() !== (it.title || '').trim()) ? it.title_zh : '';

    var sum = it.title_zh ? (it.brief || it.summary) : it.summary;    // 摘要判据不变: 有 title_zh 即视为英文条目
    return '<article class="news-card rv in" data-src="' + esc(it.source) + '">' +
      '<div class="nc-top"><span class="nc-srcb s-' + esc(it.source) + '"><i class="' + icon + '"></i>' + esc(it.source_name) + '</span>' +
      (it.category ? '<span class="nc-cat">' + esc(it.category) + '</span>' : '') +
      '<time class="nc-date" datetime="' + esc(it.date) + '">' + esc(it.date) + '</time></div>' +
      '<h3 class="nc-title"><a href="news/p/' + esc(it.id) + '.html">' + esc(title) + '</a></h3>' +
      (zhTitle ? '<p class="nc-orig">原题：' + esc(it.title) + '</p>' : '') +
      '<p class="nc-sum">' + esc(sum) + '</p>' +
      (it.quip ? '<p class="nc-quip"><i class="fa-solid fa-quote-left"></i>' + esc(it.quip) + '</p>' : '') +
      '<div class="nc-foot">' +
      '<span class="nc-src">' + esc(it.author) + '</span>' +
      '<span class="nc-actions">' +
      '<button type="button" class="nc-ask" data-t="' + esc(title) + '"><i class="fa-solid fa-wand-magic-sparkles"></i>问句子</button>' +
      '<a class="nc-read" href="' + safeHref(it.url) + '" target="_blank" rel="noopener">读原文<i class="fa-solid fa-arrow-up-right-from-square"></i></a>' +
      '</span></div></article>';
  }

  function filtered() {
    var kw = state.q.toLowerCase();
    return data.filter(function (it) {
      if (!inGroup(it)) return false;
      if (state.src !== 'all' && it.source !== state.src) return false;
      if (state.cat !== 'all' && it.category !== state.cat) return false;
      if (state.cut && it.date < state.cut) return false;
      if (kw && (it.title + ' ' + (it.title_zh || '') + ' ' + it.summary + ' ' + (it.brief || '') + ' ' + it.category + ' ' + it.source_name).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
  }

  function render(resetList) {
    var f = filtered();
    if (resetList) { list.innerHTML = ''; state.shown = 0; state.lastYear = ''; }
    var next = f.slice(state.shown, state.shown + BATCH);
    if (next.length) {
      // 公司区按年分组: 每年首张卡前插年份标(横跨两列)。雷达区不分——它 87% 是近 30 天,
      // 按年分毫无信息量。年份标不计入 state.shown(那是卡片游标, 决定「加载更多」的边界)。
      var yearMode = state.group === 'company', cnt = {};
      if (yearMode) f.forEach(function (it) { var y = it.date.slice(0, 4); cnt[y] = (cnt[y] || 0) + 1; });
      var html = '';
      next.forEach(function (it) {
        if (yearMode) {
          var y = it.date.slice(0, 4);
          if (y !== state.lastYear) {
            html += '<div class="yr-mark"><b>' + y + '</b><i></i><small>' + cnt[y] + ' 篇</small></div>';
            state.lastYear = y;
          }
        }
        html += cardHTML(it);
      });
      list.insertAdjacentHTML('beforeend', html);
    }
    state.shown += next.length;
    var isFiltered = state.src !== 'all' || state.cat !== 'all' || state.time !== 'all' || state.q;
    count.textContent = isFiltered ? (f.length + ' / ' + groupCount(state.group) + ' 条') : ('共 ' + groupCount(state.group) + ' 条');
    empty.classList.toggle('show', f.length === 0);
    more.hidden = state.shown >= f.length;
  }

  function groupCount(g) {
    // 分片后 data 里只有内联部分, 未加载的雷达余量(radar_rest)要计入, 否则计数自我矮化
    var n = data.filter(function (it) { return g === 'all' || grpOf(it.source) === g; }).length;
    // radarGaveUp: 分片确认拉不到了, 余量不能再算进计数——否则页签写 234 而列表只有 24 条
    var rest = ((radarLoaded || radarGaveUp) ? 0 : (payload.radar_rest || 0));
    return (g === 'company') ? n : n + rest;
  }
  function buildGroups() {
    var el = document.getElementById('newsGroups');
    el.innerHTML = GROUPS.map(function (g) {
      return '<button type="button" class="cat-btn' + (g.k === state.group ? ' on' : '') + '" data-group="' + g.k +
             '" role="tab" aria-selected="' + (g.k === state.group) + '"><i class="' + g.i + '"></i>' + g.n +
             '<small>' + groupCount(g.k) + '</small></button>';
    }).join('');
  }
  function buildSrcs() {
    // 只列当前分区内的源(分区=主筛选, 源=组内次筛选)
    // 空源不出 tab(公众号/媒体报道暂无内容时不该摆个 0 在脸上); 数据源面板仍照实显示
    var inb = sources.filter(function (s) { return (state.group === 'all' || (s.group || 'radar') === state.group) && s.count > 0; });
    var tot = groupCount(state.group);
    // 选中态必须读 state.src: 搜索路径调 ensureRadar 时并不重置 state.src/state.cat,
    // 无条件把「全部」写成选中会让筛选条与实际结果脱钩——UI 说「全部」, 列表却只有某一源。
    var allOn = state.src === 'all';
    var html = '<button type="button" class="cat-btn' + (allOn ? ' on' : '') + '" data-src="all" role="tab" aria-selected="' + allOn + '">全部<small>' + tot + '</small></button>';
    inb.forEach(function (s) {
      var on = state.src === s.id;
      html += '<button type="button" class="cat-btn' + (on ? ' on' : '') + '" data-src="' + esc(s.id) + '" role="tab" aria-selected="' + on + '"><i class="' + (ICON[s.id] || 'fa-solid fa-newspaper') + '"></i>' + esc(s.name) + '<small>' + s.count + '</small></button>';
    });
    srcs.innerHTML = html;
  }

  function buildCats() {
    cats.innerHTML = ''; cats.hidden = true;
    if (state.src === 'all') return;
    var seen = {}, order = [];
    data.forEach(function (it) {
      if (!inGroup(it) || it.source !== state.src || !it.category) return;
      if (!seen[it.category]) { seen[it.category] = 0; order.push(it.category); }
      seen[it.category]++;
    });
    if (order.length < 2) return; // 该来源只有一种分类时二级筛选没有意义
    order.sort(function (a, b) { return seen[b] - seen[a]; });
    // 选中态读 state.cat, 不硬编码——与 buildSrcs 同款理由: 调用方并不总是先重置 state,
    // 写死「全部分类」选中会让筛选条与实际结果脱钩。
    var allOn = state.cat === 'all';
    var html = '<button type="button" class="cat-btn' + (allOn ? ' on' : '') + '" data-cat="all" role="tab" aria-selected="' + allOn + '">全部分类</button>';
    order.forEach(function (c) {
      var on = state.cat === c;
      html += '<button type="button" class="cat-btn' + (on ? ' on' : '') + '" data-cat="' + esc(c) + '" role="tab" aria-selected="' + on + '">' + esc(c) + '<small>' + seen[c] + '</small></button>';
    });
    cats.innerHTML = html; cats.hidden = false;
  }

  function buildTimes() {
    times.innerHTML = TIMES.map(function (t) {
      var on = t.k === state.time;
      return '<button type="button" class="cat-btn' + (on ? ' on' : '') + '" data-time="' + t.k + '" role="tab" aria-selected="' + on + '">' +
        (t.k === 'all' ? '<i class="fa-solid fa-clock"></i>' : '') + t.label + '</button>';
    }).join('');
  }

  function mark(box, attr, val) {
    box.querySelectorAll('[' + attr + ']').forEach(function (x) {
      var on = x.getAttribute(attr) === val;
      x.classList.toggle('on', on);
      if (x.getAttribute('role') === 'tab') x.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  function init() {
    if (!data.length) { document.getElementById('newsBar').style.display = 'none'; return; } // 数据缺失：保留预渲染卡片兜底
    total.textContent = groupCount('company');
    var rEl = document.getElementById('newsRadar'); if (rEl) rEl.textContent = groupCount('radar');
    buildGroups(); buildSrcs(); buildTimes();
    count.textContent = '共 ' + groupCount(state.group) + ' 条';
    more.hidden = state.shown >= data.length;
    // 默认视图=句子动态, 预渲染=全量: 首帧按分区重渲(否则首屏仍是混排)
    render(true);

    // 雷达数据按需加载(2026-07-30 分片): 内联只带句子动态全量 + 雷达前 N 条, 首次切到
    // 雷达/全部时补齐余量; 失败就用已内联的, 不白屏也不报错(渐进增强)。
    function ensureRadar(after) {
      if (radarLoaded || radarGaveUp || radarLoading) { after(); return; }
      radarLoading = true;
      // 状态代数: 记下发起时的 navGen。分片是一次冷网络请求(146KB), 弱网下几秒量级,
      // 这期间用户完全可能切走。迟到的回调若无条件跑 after(=render(true)), 会 innerHTML=''
      // 把用户此间「加载更多」展开的列表整个推倒、滚动位置一并作废。
      var gen = navGen;
      setBusy(true);
      fetch('news-radar.json').then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.items && j.items.length) {
          // 追加后必须重排: 内联段与分片段各自有序, 直接 concat 会让「全部」分区的时间流
          // 在接缝处倒回。排序键与 build_news.py 的全局排序一致(date 倒序, id 兜底稳定)。
          data = data.concat(j.items).sort(function (a, b) {
            if (a.date !== b.date) { return a.date < b.date ? 1 : -1; }
            return a.id < b.id ? 1 : (a.id > b.id ? -1 : 0);
          });
        }
        radarLoaded = true; radarLoading = false; setBusy(false);
        buildGroups();                       // 计数刷新与当前视图无关, 总要做
        if (gen !== navGen) { return; }      // 用户已切走: 数据留下, 但别动他现在的列表
        buildSrcs(); after();
      }).catch(function () {
        // 失败**不**标记 radarLoaded: 那等于"这次没拉到就永久放弃", 用户再点也不会重试,
        // 而一次网络抖动不该让 210 条内容在整个会话里消失。留给下次点击重试。
        // 但也不能无限重试: 连续三次失败(离线/文件真的 404)才认定不可用, 转为 gaveUp,
        // 此时计数回落到实际可用条数——否则页签写 234、列表只有 24 条, 数字对不上。
        radarLoading = false;
        // gaveUp 必须先置位再 setBusy: setBusy(false) 会用 groupCount() 把计数写回 count
        // 元素, 而 groupCount 要看 radarGaveUp 才知道该不该把未加载余量算进去。顺序颠倒
        // 的话第三次失败时 count 仍是含余量的虚高数字, 只有页签被 buildGroups() 修正。
        if (++radarFail >= 3) { radarGaveUp = true; buildGroups(); }  // 只置 gaveUp: radarLoaded 表示「数据已就绪」, 失败时它并没就绪
        setBusy(false);
        if (gen !== navGen) { return; }
        buildSrcs(); after();
      });
    }
    function setBusy(on) {
      // 点了没反应正是诱发用户额外操作、把竞态窗口填满的原因, 给个明确的进行中反馈。
      // 关掉时必须把计数写回去: 成功路径靠随后的 render() 覆盖, 但「用户已切走」那条
      // return 分支不会走到 render, 计数会永久停在"正在加载…"。
      list.setAttribute('aria-busy', on ? 'true' : 'false');
      count.textContent = on ? '正在加载行业雷达…' : ('共 ' + groupCount(state.group) + ' 条');
    }
    document.getElementById('newsGroups').addEventListener('click', function (e) {
      var b = e.target.closest('[data-group]'); if (!b) return;
      navGen++;  // 本次切换作废此前所有在飞的分片回调
      state.group = b.getAttribute('data-group'); state.src = 'all'; state.cat = 'all';
      mark(document.getElementById('newsGroups'), 'data-group', state.group);
      // 先用已内联的数据立刻渲染(雷达前 24 条就在内联里), 再异步补齐余量。
      // 原先切到雷达时在 fetch 落地前完全不渲染: 界面停在公司区的列表, 而 state.group
      // 已经是 radar —— 此时点「加载更多」, filtered() 按 radar 过滤但 state.shown 还是
      // 公司区留下的游标, 直接错位; 而且"点了没反应"本身就在诱导用户多点。
      buildSrcs(); buildCats(); render(true);
      if (state.group !== 'company') {
        ensureRadar(function () {
          // 分片到达后重排了 data, 必须整段重渲; 但要把用户此间手动加载出来的量补回去,
          // 否则他刚展开到 60 条又被打回 20 条(navGen 只挡「切走」, 挡不住同分区展开)。
          var target = state.shown;
          render(true);
          while (state.shown < target && !more.hidden) { render(); }
        });
      }
    });
    srcs.addEventListener('click', function (e) {
      var b = e.target.closest('[data-src]'); if (!b) return;
      state.src = b.getAttribute('data-src'); state.cat = 'all';
      mark(srcs, 'data-src', state.src); buildCats(); render(true);
    });
    cats.addEventListener('click', function (e) {
      var b = e.target.closest('[data-cat]'); if (!b) return;
      state.cat = b.getAttribute('data-cat');
      mark(cats, 'data-cat', state.cat); render(true);
    });
    times.addEventListener('click', function (e) {
      var b = e.target.closest('[data-time]'); if (!b) return;
      state.time = b.getAttribute('data-time'); state.cut = '';
      for (var i = 0; i < TIMES.length; i++) if (TIMES[i].k === state.time) state.cut = TIMES[i].cut;
      mark(times, 'data-time', state.time); render(true);
    });

    var deb;
    q.addEventListener('input', function () { clearTimeout(deb); deb = setTimeout(function () { state.q = q.value.trim(); if (state.q) { ensureRadar(function () { render(true); }); } else { render(true); } }, 180); });

    reset.addEventListener('click', function () {
      state.src = 'all'; state.cat = 'all'; state.time = 'all'; state.cut = ''; state.q = ''; q.value = '';
      mark(srcs, 'data-src', 'all'); mark(times, 'data-time', 'all'); buildCats(); render(true);
    });

    more.addEventListener('click', function () { render(false); });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) {
        es.forEach(function (en) { if (en.isIntersecting && !more.hidden) render(false); });
      }, { rootMargin: '400px 0px' }).observe(sentinel);
    }

    // 每卡「问句子」：把该卡标题作为**一次性**上下文传给 askbar。
    // 原先是改写 window.PAGE_CTX 且从不还原——点过任意一张卡之后, 本页后续所有提问
    // (包括从右下角常驻入口发起的)都被永久打上那篇文章的上下文, 越点越错。
    list.addEventListener('click', function (e) {
      var b = e.target.closest('.nc-ask'); if (!b) return;
      var cardCtx = { entity: 'news-article', type: 'article', title: b.getAttribute('data-t') };
      if (window.openAskbar) window.openAskbar(cardCtx);
      else setTimeout(function () { if (window.openAskbar) window.openAskbar(cardCtx); }, 450); // askbar 异步注入的兜底
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
