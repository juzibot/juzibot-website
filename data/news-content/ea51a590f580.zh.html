<blockquote cite="https://twitter.com/gdb/status/2083435180392673714"><p>在 OpenAI，很多人会把 ChatGPT 连接到 Slack 上。</p>
<p>当同事的 ChatGPT 联系他们请求帮忙处理任务时，人们真的会感到反感，即便如果是由那位同事本人提出同样的请求，他们其实会很乐意帮忙。</p>
<p>这凸显了人们多么重视人际关系和互相帮助，并且希望 AI 能够节省时间——或是增进共处时光——而不是成为人与人之间的一层隔阂。</p></blockquote>
<p class="cite">&mdash; <a href="https://twitter.com/gdb/status/2083435180392673714">Greg Brockman</a>, OpenAI 总裁兼联合创始人</p>
