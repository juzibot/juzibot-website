<blockquote cite="https://blog.pypi.org/posts/2026-07-22-releases-now-reject-new-files-after-14-days/"><p>Python 包索引 (PyPI) 现在会拒绝上传到超过 14 天的发布版本中的新文件。这项限制<a href="https://github.com/pypi/warehouse/pull/19727">已经实施</a>，旨在防止在 PyPI 项目的发布令牌或工作流程遭到泄露的情况下，旧的、长期稳定的发布版本被恶意篡改。据我们所知，目前尚未发生此类滥用事件，但之所以没有出现技术层面的攻击，仅仅是因为攻击者尚未意识到这是可行的。</p></blockquote>
<p class="cite">&mdash; <a href="https://blog.pypi.org/posts/2026-07-22-releases-now-reject-new-files-after-14-days/">Seth Larson</a>, PyPI 博客</p>
