<p>GCC指导委员会已<a href="https://lwn.net/ml/all/CAGWvny=KZcazorvmCU3gdT4dBcMJm6S_769Ne+aTfbO_nZ_HsQ@mail.gmail.com/" target="_blank" rel="noopener nofollow">宣布</a>，他们接受了GCC AI政策工作组推荐的<a href="https://forge.sourceware.org/redi/gcc-wwwdocs/commit/4d0793a6a14bf9bfe9e92ac1599840780355199d" target="_blank" rel="noopener nofollow">AI贡献政策</a>。</p>

<p>该政策部分规定，项目将拒绝任何"包含LLM生成内容或源自LLM生成内容的法律上重要的贡献"。政策采用了GNU项目维护指南中对"法律上重要"的<a href="https://www.gnu.org/prep/maintain/maintain.html#Legally-Significant" target="_blank" rel="noopener nofollow">定义</a>，该定义认为，出于版权目的，"大约15行代码和/或文本"的门槛即构成重要贡献。不过，GCC维护者可以选择接受由LLM生成的法律上重要的测试用例。</p>

<p>该政策并不禁止将LLM用于研究、分析、缺陷发现与报告、补丁审查等用途，只要其输出内容不包含在贡献中。委员会表示，他们预计该政策将不断演变，并会定期进行审议。</p>
