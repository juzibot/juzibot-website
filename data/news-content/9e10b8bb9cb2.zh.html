<blockquote cite="https://twitter.com/bcherny/status/2080713091688583312"><p>比起任何这些评估分数，最让我兴奋的是另一件事：Opus 5 是我们迄今为止最难被提示注入（prompt inject）的模型。这一点在系统卡片（System Card）里可能有点不起眼，但在各种提示注入评估和红队测试中，都很难成功地对 Opus 5 进行提示注入。</p></blockquote>
