# ============================================================================
# 缓存策略 —— 需运维加进 jz-main 与 jz-stage-* 的每个 server 块
# ============================================================================
# 为什么需要它(2026-07-31 实测的一次真事故):
#
# 给全站导航加「动态」入口、部署完成之后, 骐畅在 enterprise.html / about.html 上**仍然
# 看不到**。而查下来每一层单独看都是对的:
#   · 线上 assets/site.js 第 51 行确实有那条入口
#   · 两页确实用注入导航(`id="site-nav"` 1 处, 自带 nav-item 0 处)
#   · 页面确实引用了打过戳的 `assets/site.js?v=f57b1388`
# 原因在响应头, 而且是**两层叠加**:
#
#   ① HTML 只有 Last-Modified + ETag, **没有 Cache-Control / Expires**
#      → 浏览器走"启发式缓存": 按 (现在 − Last-Modified) 的约 10% 自己定新鲜期。
#        上次访问时那些页的 Last-Modified 还是三周前 → 算出约 2 天新鲜期 →
#        **这两天根本不问服务器**, 手里一直是旧 HTML。
#   ② 旧 HTML 里引用的是**没带版本号**的 `assets/site.js`, 而静态资源发的是
#      `Cache-Control: public, max-age=604800`(7 天强缓存, 不回源校验) → 也是旧的。
#
# 两层一叠, 改动对老访客最长一周不生效, 而我们这边 curl(不带缓存)怎么查都正常 ——
# 「产物正常 ≠ 功能生效」的最隐蔽一种: **服务端和客户端拿到的是两份不同的文件**。
#
# 正确配法是一对, 缺一不可:
#   · HTML **每次回源校验**(no-cache 不是不缓存, 是"可以存但用前必须问一次";
#     配合 ETag, 没变时服务器回 304, 只有几十字节的开销)
#   · 带内容哈希的静态资源才能长缓存 + immutable(URL 变了才算新文件 ——
#     打戳由 stamp_assets.py 按文件内容算, 见 README「静态资源版本戳」)
#
# ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

# HTML: 允许缓存, 但每次使用前必须回源校验(ETag 命中就 304, 几乎零成本)
location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
}

# 目录索引(/ 与 /xxx/)同样是 HTML, 一并覆盖
location = / {
    add_header Cache-Control "no-cache" always;
}

# 带版本戳的静态资源: 长缓存 + immutable。URL 里有 ?v=<内容哈希>, 内容一变 URL 就变,
# 所以永远不会拿到过期的东西 —— 这正是长缓存能安全生效的前提。
location ~* ^/assets/.+\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# 图片/字体等不带戳的静态资源: 保持较长缓存但允许回源校验, 避免换图后长期不生效
location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
    add_header Cache-Control "public, max-age=604800, must-revalidate" always;
}

# ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
#
# 生效自查(改完 nginx -t && reload 之后):
#   curl -sI https://<host>/enterprise.html   | grep -i cache-control   # 应为 no-cache
#   curl -sI https://<host>/assets/site.js    | grep -i cache-control   # 应为 immutable
#
# 注意: add_header 在同一 location 层级会覆盖上层的同名头; 若 server 块里已有全局
# `expires` 指令, 需要把它去掉或改成按上述 location 分类, 否则这里的设置可能被顶掉。
