# Include inside BOTH production server blocks (and the preview server if enabled).
# Use a separate preview service/port/table/database. Do not route preview to production.
location = /api/agentcamp/applications {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite rather than append: the API trusts only this loopback nginx hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 40s;
    proxy_send_timeout 10s;
    proxy_intercept_errors off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

# Do not let the site's unknown-path homepage fallback masquerade as an API reply.
location /api/agentcamp/ { return 404; }

# The source tree may be the document root. The API and its state are never public.
location ^~ /backend/ { return 404; }
location ^~ /deploy/ { return 404; }
location ~ /\. { deny all; }
