name: AgentCamp API
on:
  pull_request:
    paths:
      - 'backend/agentcamp/**'
      - 'assets/agentcamp.js'
      - 'agentcamp.html'
      - '.github/workflows/agentcamp-api.yml'
  push:
    branches: ['feat/agentcamp-page']
    paths:
      - 'backend/agentcamp/**'
      - 'assets/agentcamp.js'
      - 'agentcamp.html'
      - '.github/workflows/agentcamp-api.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/agentcamp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/agentcamp/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
