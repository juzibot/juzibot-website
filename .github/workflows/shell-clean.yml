name: shell-clean
# 模板壳纯净闸(2026-07-30): 「生成物不入库」是架构裁决(佳芮 2026-07-23), 但人手在
# stage-2 预览与 PR 分支间来回拷文件时, 极易把注入了数据的 news.html 带回仓库
# (本 PR 就发生过: eafb0e3 起三个 commit 各带 223KB 生成数据)。用 CI 把这条守住。

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 页面模板壳不得含生成数据
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          bad = []
          for f in ("news.html", "news-c.html"):
              p = pathlib.Path(f)
              if not p.exists():
                  continue
              t = p.read_text(encoding="utf-8")
              size = len(t.encode()) // 1024
              d = re.search(r'<script id="news-data"[^>]*>(.*?)</script>', t, re.S)
              pre = re.search(r'NEWS:LIST:BEGIN.*?-->(.*?)<!-- NEWS:LIST:END', t, re.S)
              if d and len(d.group(1)) > 200:
                  bad.append(f"{f}: news-data 内联了 {len(d.group(1))//1024}KB 生成数据(壳里应为空)")
              if pre and len(pre.group(1).strip()) > 40:
                  bad.append(f"{f}: 预渲染区有 {len(pre.group(1))//1024}KB 生成卡片(壳里应为空)")
              if size > 60:
                  bad.append(f"{f}: {size}KB —— 模板壳正常在 30KB 以内, 疑似混入生成物")
          if bad:
              print("::error::模板壳混入生成物(生成物不入库, 见 CLAUDE.md 动态页一节):")
              for b in bad:
                  print(f"::error::  {b}")
              print("修法: 清空 news-data 为 {\"sources\":[],\"items\":[]}、清空 NEWS:LIST 区块后重新提交")
              sys.exit(1)
          print("模板壳干净 ✓")
          PY
      - name: 生成物不得入库
        run: |
          for p in news/ data/news.json data/concepts.json data/render-cache.json data/metrics.jsonl data/news-content/ sitemap-news.xml news-radar.json news-feed.xml; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error::$p 被提交进仓库了(生成物不入库)"; exit 1
            fi
          done
          echo "生成物未入库 ✓"
